name: keep-awake
on:
  schedule:
    # staggered offsets: github drops slot-aligned crons under load, spread deliveries
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the sanctuary
        run: curl -fsS --max-time 30 https://the-sanctuary-jfze.onrender.com/api/ping